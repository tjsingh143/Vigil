name: Linux build, contracts and fuzz
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build and PostgreSQL dependencies (no vcan setup)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libcmocka-dev libpq-dev postgresql libsystemd-dev clang libclang-rt-dev python3-venv curl
          ./scripts/setup-sqlite
          python3 -m venv .venv
          .venv/bin/python -m pip install -r simulator/requirements.txt
      - name: Build, unit tests, non-vcan contracts, sanitizers, static analysis and fuzz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ./scripts/check-ci --clean 2>&1 | tee artifacts/ci.log
      - name: Retain logs and fuzz artifacts, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-evidence
          path: |
            artifacts/
            build-ci/Testing/Temporary/
            build-ci-sanitize/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
# Real SocketCAN/vcan and systemd supervision are mandatory Linux-local gates:
# ./scripts/check-resilience --clean --output artifacts/local-rc
# The hosted subset includes unprivileged outbox units on native local storage
# and disposable PostgreSQL v1/v2 contracts; no vcan, mount or systemd fixture.
# Never substitute a virtual Python bus for the mandatory Linux-local gates.
