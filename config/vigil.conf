# Optional file; these match vigild's built-in defaults (pod 1).
# All values are integers. Temperature units are 0.01 C; door units are 0/1.
tick_ms 100
status_ms 1000
# pod ID heartbeat_timeout_ms
pod 1 3000
# source POD CHANNEL timeout_ms min max rate_units_per_s flat_ms high clear
source 1 temperature 3000 -4000 8500 500 60000 2700 2600
source 1 door        3000 0 1 0 0 1 0
# To monitor a second pod, uncomment all three lines:
# pod 2 3000
# source 2 temperature 3000 -4000 8500 500 60000 2700 2600
# source 2 door        3000 0 1 0 0 1 0
